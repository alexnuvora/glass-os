plugins { id 'com.android.application' }
android {
    namespace 'com.glassos.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.glassos.launcher'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.github.QWEA0:liquidglass:v2.0.1' }
