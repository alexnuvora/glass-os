name: Import complete Folio launcher
on:
  push:
    branches: [main]
    paths: ['.github/workflows/folio-import.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GlassOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch Folio full source
        run: |
          git clone --depth=1 --branch main https://github.com/McCal-Codes/folio.git /tmp/folio-upstream
          git -C /tmp/folio-upstream rev-parse HEAD > /tmp/folio-source-sha
      - name: Construct full Folio-based GlassOS branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GlassOS Migration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C folio-full-port
          # Whole repository: not a partial UI transplant.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude=.git --exclude=.github /tmp/folio-upstream/ ./
          # Keep GlassOS independent branding while retaining Folio's Kotlin namespace.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('settings.gradle.kts')
          p.write_text(p.read_text().replace('rootProject.name = "Folio"','rootProject.name = "GlassOS"'))
          p=Path('app/build.gradle.kts')
          p.write_text(p.read_text().replace('applicationId = "com.mccal.folio"','applicationId = "com.glassos.launcher"'))
          p=Path('app/src/main/res/values/strings.xml')
          if p.exists():
              s=p.read_text()
              s=s.replace('name="app_name">Folio<','name="app_name">GlassOS<')
              p.write_text(s)
          PY
          cat > GLASSOS-MIGRATION.md <<EOF
          # Full Folio-derived GlassOS migration
          Source: https://github.com/McCal-Codes/folio
          Upstream commit: $(cat /tmp/folio-source-sha)
          The entire upstream source, resources, modules, SDK tools, legal notices, and assets were imported.
          Android applicationId: com.glassos.launcher. Kotlin source namespace stays com.mccal.folio to avoid breaking imports.
          Licence: MIT; see LICENSE and upstream notices.
          This branch is a staging port, not the production main branch until build and on-device tests are completed.
          EOF
          git add -A
          git commit -m "Full-source Folio port into GlassOS (MIT, staged)"
          git push origin HEAD:refs/heads/folio-full-port
      - name: Switch to imported Folio source before compiling
        run: |
          git fetch origin folio-full-port
          git checkout -B folio-full-port origin/folio-full-port
          test -f ./gradlew && chmod +x ./gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Folio-based GlassOS
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload migrated APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GlassOS-Folio-full-port
          path: app/build/outputs/apk/debug/*.apk
